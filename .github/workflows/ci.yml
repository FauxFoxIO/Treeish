name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Production boundary scan
        run: sh Scripts/check-production-boundaries.sh
      - name: macOS tests
        run: swift test
      - name: Generic iOS build
        run: xcodebuild -scheme Treeish -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
