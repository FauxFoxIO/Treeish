name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate package manifest
        run: swift package dump-package >/dev/null
      - name: Require Swift-only production sources
        run: |
          unexpected_sources="$(
            find Sources -type f \
              ! -name '*.swift' \
              ! -path '*/Treeish.docc/*'
          )"
          if [ -n "$unexpected_sources" ]; then
            echo "$unexpected_sources"
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Build release configuration
        run: swift build --configuration release
      - name: Build documentation
        run: >-
          xcodebuild docbuild
          -scheme Treeish
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/Treeish-Documentation"
          CODE_SIGNING_ALLOWED=NO

  ios:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS device
            destination: generic/platform=iOS
            derived_data: Treeish-iOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
            derived_data: Treeish-iOS-Simulator
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: >-
          xcodebuild build
          -scheme Treeish
          -destination '${{ matrix.destination }}'
          -derivedDataPath "$RUNNER_TEMP/${{ matrix.derived_data }}"
          CODE_SIGNING_ALLOWED=NO
